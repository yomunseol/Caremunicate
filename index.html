<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caremunicate</title>
    <meta
      name="description"
      content="Caremunicate — multilingual healthcare communication. Find providers, book appointments and start a secure video consultation in ten languages."

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Caremunicate" />
    <meta property="og:title" content="Caremunicate" />

      property="og:description"
      content="Multilingual healthcare communication. Find providers, book appointments and start a secure video consultation in ten languages."
    />
    <meta property="og:url" content="https://caremunicate.online/" />
    <meta property="og:image" content="https://caremunicate.online/HealthcareTeamCollab.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Caremunicate" />
    <meta
      name="twitter:description"
      content="Multilingual healthcare communication. Find providers, book appointments and start a secure video consultation in ten languages."
    />
    <meta name="twitter:image" content="https://caremunicate.online/HealthcareTeamCollab.jpg" />

    <!-- The mint accent token (--accent). -->
    <meta name="theme-color" content="#3ea985" />
    <link rel="icon" type="image/png" href="/Caremunicate.png" />
    <link rel="apple-touch-icon" href="/Caremunicate.png" />
  </head>
